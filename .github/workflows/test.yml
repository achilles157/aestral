name: Test & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.3'
          channel: 'stable'
          cache: true

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Check test results
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "❌ Coverage file not generated"
            exit 1
          fi
          echo "✅ Tests completed successfully"

      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Generate coverage report
        run: |
          lcov --summary coverage/lcov.info
          lcov --list coverage/lcov.info | head -50

      - name: Check coverage threshold
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | awk '{print $2}' | sed 's/%//')
          echo "📊 Current coverage: ${COVERAGE}%"
          
          # Target: 20% foundation (Week 1), 40% (Week 4), 60% (Week 8)
          THRESHOLD=18
          
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "⚠️  Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            echo "Note: Foundation target is 18-20%, full target is 60%"
            # Don't fail yet - we're building foundation
            # Uncomment when ready to enforce:
            # exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets ${THRESHOLD}% threshold"
          fi

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('coverage/lcov.info', 'utf8');
            const lines = coverage.match(/LF:(\d+)/g);
            const found = coverage.match(/LH:(\d+)/g);
            
            if (lines && found) {
              const totalLines = lines.reduce((sum, l) => sum + parseInt(l.split(':')[1]), 0);
              const coveredLines = found.reduce((sum, l) => sum + parseInt(l.split(':')[1]), 0);
              const percent = ((coveredLines / totalLines) * 100).toFixed(2);
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 📊 Test Coverage Report\n\n- **Coverage:** ${percent}%\n- **Lines:** ${coveredLines}/${totalLines}\n- **Target:** 60% (current foundation: 18-20%)\n\n${percent >= 18 ? '✅' : '⚠️'} Foundation coverage threshold`
              });
            }
