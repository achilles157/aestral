name: Conventional Commit Check

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  check-commits:
    name: Check Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check conventional commit format
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}

          echo "🔍 Checking commits from $BASE_SHA to $HEAD_SHA"

          BAD_COMMITS=0
          for sha in $(git rev-list --no-merges ${BASE_SHA}..${HEAD_SHA}); do
            msg=$(git log --format=%s -n 1 $sha)
            if ! echo "$msg" | grep -qE '^(feat|fix|refactor|perf|docs|style|test|ci|chore|build|revert)(\(.+\))?:\s'; then
              echo "❌ $sha: $msg"
              echo "   Must match: type(scope): description"
              echo "   Valid types: feat, fix, refactor, perf, docs, style, test, ci, chore, build, revert"
              BAD_COMMITS=$((BAD_COMMITS + 1))
            fi
          done

          if [ $BAD_COMMITS -gt 0 ]; then
            echo ""
            echo "❌ $BAD_COMMITS commit(s) tidak mengikuti Conventional Commits"
            echo "   Format: type(scope): description"
            echo "   Contoh: feat(weton): tambah dual element tie-breaking"
            exit 1
          fi

          echo "✅ All commits follow Conventional Commits format"
