name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release
        timeout-minutes: 15

      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -sh build/web | awk '{print $1}')
          echo "📦 Web Bundle Size: ${BUNDLE_SIZE}"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AESTRAL_CA7AE }}
          channelId: live
          projectId: aestral-ca7ae
