name: Deploy Worker (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - 'aestral-backend/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aestral-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aestral-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync shared data
        run: node scripts/sync-shared-data.js

      - name: Type check
        run: npx tsc --noEmit

      - name: Run backend tests
        run: npm test -- --run
        env:
          GEMINI_API_KEY: placeholder-not-used-in-tests

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: aestral-backend
          command: deploy
