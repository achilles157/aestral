# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # ── Code quality ──────────────────────────────────────────────────────────

    # Prefer const constructors where possible — reduces widget rebuild cost
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    # Avoid unnecessary type annotations that Dart can infer
    omit_local_variable_types: false
    always_specify_types: false

    # Require type annotations on public API members
    type_annotate_public_apis: true

    # Avoid dynamic where possible
    avoid_dynamic_calls: true

    # Prefer final for local variables that are not reassigned
    prefer_final_locals: true
    prefer_final_in_for_each: true

    # ── Error prevention ──────────────────────────────────────────────────────

    # Avoid print() in production code — use debugPrint() instead
    avoid_print: true

    # Always require curly braces to prevent dangling-else bugs
    curly_braces_in_flow_control_structures: true

    # Catch clause must not silently swallow errors without variable
    avoid_catches_without_on_clauses: false   # too strict for some fallback patterns

    # Avoid empty catch blocks
    empty_catches: true

    # Don't use 'var' when type is known — improves readability
    prefer_typing_uninitialized_variables: true

    # ── Async / Future ────────────────────────────────────────────────────────

    # Await futures properly — prevents fire-and-forget bugs
    unawaited_futures: true

    # Don't return null from async functions returning Future<void>
    avoid_void_async: false   # too strict with event handlers

    # ── Flutter-specific ──────────────────────────────────────────────────────

    # Use SizedBox instead of Container for whitespace
    sized_box_for_whitespace: true

    # Prefer const SizedBox.shrink() over Container()
    sized_box_shrink_expand: true

    # Use ColorScheme instead of raw color constants where possible
    use_colored_box: true

    # Avoid unnecessary overrides that just call super
    unnecessary_overrides: true

    # ── Style ─────────────────────────────────────────────────────────────────

    # Prefer single quotes for strings (consistent with most Flutter codebases)
    prefer_single_quotes: true

    # Sort constructors before other members
    sort_constructors_first: true

    # Use trailing commas in multi-line function calls — improves diffs
    require_trailing_commas: true

analyzer:
  errors:
    # Treat missing return as error
    missing_return: error
    # Treat dead code as warning
    dead_code: warning
    # Deprecated member use: warn but don't fail
    deprecated_member_use: warning
    deprecated_member_use_from_same_package: warning

  exclude:
    - "**/*.g.dart"          # generated files
    - "**/*.freezed.dart"    # freezed generated files
    - lib/firebase_options.dart  # generated by FlutterFire CLI

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
